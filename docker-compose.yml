services:
  mongo:
    image: mongo:5
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - roamly-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - MONGO_URL=mongodb://mongo:27017/roamly
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret-string}
      - PORT=5001
    depends_on:
      - mongo
    networks:
      - roamly-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./client/src:/app/client/src
      - /app/client/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5001/api
      - REACT_APP_IMAGES_URL=http://localhost:5001/api/images
    depends_on:
      - server
    networks:
      - roamly-net

volumes:
  mongo-data:

networks:
  roamly-net:
    driver: bridge
